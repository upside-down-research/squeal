[package]
name = "squeal"
# Squeal is pre-release
version = "0.1.2"
edition = "2024"
description = "A SQL query builder library for Rust"
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/upside-down-research/squeal"
documentation = "https://docs.rs/squeal"
authors= ["Upside Down Research"]
rust-version = "1.90"
categories = ["database"]
exclude = [
    ".bazelignore",
    ".bazelrc",
    ".bazelversion",
    ".buildbuddy/",
    ".config/",
    ".github/",
    ".gitlab-ci.yml",
    ".idea/",
    "BUILD.bazel",
    "CLAUDE.md",
    "MODULE.bazel",
    "MODULE.bazel.lock",
    "bzsh",
    "tarpaulin.toml",
]

[features]
postgres-docker = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]


[dev-dependencies]
postgres = "0.19.14"
criterion = { version = "0.8", features = ["html_reports"] }
testcontainers = { version = "0.15" }
testcontainers-modules = { version = "0.2.1", features = ["postgres"] }
[[bench]]
name = "benchmark"
harness = false